name: Paper trading tests
on:
  push:
    branches: [agentic-trader-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run paper-trading safety tests
        run: python -m pytest -q test_paper_trading.py test_paper_trade_preview.py
